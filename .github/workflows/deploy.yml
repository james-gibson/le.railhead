name: deploy

on:
  push:
    branches: [main]
  # The record describes a moving project. A daily rebuild re-reads the upstream
  # repository, publishes the answer to /upstream.json, and deploys even when
  # nothing in this repo changed — so "stale" becomes a visible fact.
  schedule:
    - cron: '17 6 * * *' # 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The seed manages its updates from its own rotation record: a gap, an
      # unclosed cycle, or a rung of DEGRADED or worse refuses here. Read-only,
      # so the workflow keeps a read-only token.
      - run: npm run rotation -- gate

      # The child follows the parent's rules on its own cycle. A rebuild that
      # would deploy against an older rule list refuses here, and the fix is one
      # `npm run sync` plus a commit — the rule arrives as a commit, so the
      # build itself stays reproducible from the checkout.
      - run: npm run rules

      # upstream check, tsc --noEmit, contrast, vite, prerender, shells,
      # llms.txt, guard. A guard failure stops the deploy here, not in production.
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run smoke

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
